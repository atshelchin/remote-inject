name: Release Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - 'packages/chrome-extension/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        run: |
          CURRENT=$(node -p "require('./packages/chrome-extension/package.json').version")
          git show HEAD~1:packages/chrome-extension/package.json > /tmp/old-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/old-package.json
          PREVIOUS=$(node -p "require('/tmp/old-package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version: $PREVIOUS -> $CURRENT (build triggered)"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT"
          fi

      - name: Setup Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Cache bun dependencies
        if: steps.version.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: bun install

      - name: Build & Zip extension
        if: steps.version.outputs.changed == 'true'
        run: cd packages/chrome-extension && bun run zip

      - name: Find zip file
        if: steps.version.outputs.changed == 'true'
        id: zip
        run: |
          ZIP_FILE=$(ls packages/chrome-extension/.output/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found"
            exit 1
          fi
          echo "path=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $ZIP_FILE)" >> $GITHUB_OUTPUT
          echo "Found: $ZIP_FILE"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-v${{ steps.version.outputs.current }}
          name: Chrome Extension v${{ steps.version.outputs.current }}
          body: |
            ## Remote Inject - Chrome Extension v${{ steps.version.outputs.current }}

            ### Install
            1. Download the `.zip` file below
            2. Extract the zip file
            3. Open Chrome → `chrome://extensions/`
            4. Enable **Developer mode** (top right)
            5. Click **Load unpacked** → select the extracted folder
          files: ${{ steps.zip.outputs.path }}
          draft: false
          prerelease: false

      # ---------------------------------------------------------------
      # Chrome Web Store auto-publish
      # Requires three GitHub repository secrets:
      #   CWS_EXTENSION_ID   — the extension ID from the Developer Dashboard
      #   CWS_CLIENT_ID      — OAuth2 client ID (Google Cloud Console)
      #   CWS_CLIENT_SECRET  — OAuth2 client secret
      #   CWS_REFRESH_TOKEN  — OAuth2 refresh token (see docs/cws-oauth-setup.md)
      # ---------------------------------------------------------------
      - name: Upload to Chrome Web Store
        if: steps.version.outputs.changed == 'true' && env.CWS_EXTENSION_ID != ''
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx -y chrome-webstore-upload-cli@3 upload \
            --source "${{ steps.zip.outputs.path }}" \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish

      - name: Skip release
        if: steps.version.outputs.changed == 'false'
        run: echo "Version not changed, skipping release"
